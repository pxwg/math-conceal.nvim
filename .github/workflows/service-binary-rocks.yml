name: Release Service Binary Rocks

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "LuaRocks version/modrev to publish, for example 0.1.7"
        required: true
      git_ref:
        description: "Git ref recorded in the rockspec source block. Defaults to the current ref name."
        required: false

permissions:
  contents: read

jobs:
  prepare-service-rockspec:
    name: Prepare service release rockspec
    runs-on: ubuntu-latest
    outputs:
      git_ref: ${{ steps.rockspec.outputs.git_ref }}
      path: ${{ steps.rockspec.outputs.path }}
      version: ${{ steps.rockspec.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref }}

      - name: Render release rockspec
        id: rockspec
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_GIT_REF: ${{ github.event.inputs.git_ref }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          git_ref="${INPUT_GIT_REF:-}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$git_ref" ]; then
            git_ref="$GITHUB_REF_NAME"
          fi
          archive_suffix="${git_ref#v}"
          rockspec="math-conceal-service-${version}-1.rockspec"
          python3 - "$version" "$git_ref" "$archive_suffix" "$rockspec" <<'PY'
          import sys
          from pathlib import Path

          version, git_ref, archive_suffix, rockspec = sys.argv[1:]
          repo_url = "https://github.com/pxwg/math-conceal.nvim"

          def lua_quote(value: str) -> str:
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          text = Path("math-conceal-service-scm-1.rockspec").read_text()
          replacements = {
              "'$git_ref'": lua_quote(git_ref),
              "'$modrev'": lua_quote(version),
              "'$specrev'": lua_quote("1"),
              "'$repo_url'": lua_quote(repo_url),
              "'$homepage'": lua_quote(repo_url),
              "'$archive_dir_suffix'": lua_quote(archive_suffix),
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = text.replace("$repo_name", "math-conceal.nvim")
          Path(rockspec).write_text(text)
          PY
          echo "git_ref=$git_ref" >> "$GITHUB_OUTPUT"
          echo "path=$rockspec" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload release rockspec artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-conceal-service-${{ steps.rockspec.outputs.version }}-rockspec
          path: ${{ steps.rockspec.outputs.path }}
          if-no-files-found: error

  build-service-binary-rock:
    name: Build service binary rock (${{ matrix.os }})
    needs: prepare-service-rockspec
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-service-rockspec.outputs.git_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Download release rockspec
        uses: actions/download-artifact@v4
        with:
          name: math-conceal-service-${{ needs.prepare-service-rockspec.outputs.version }}-rockspec
          path: build/release-rockspec

      - name: Build binary rock
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_PANIC: abort
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          set -euo pipefail
          rockspec="build/release-rockspec/${{ needs.prepare-service-rockspec.outputs.path }}"
          luarocks --lua-version 5.1 make --pack-binary-rock "$rockspec"

          for rock in math-conceal-service-${{ needs.prepare-service-rockspec.outputs.version }}-1.*.rock; do
            rock_size="$(wc -c < "$rock" | tr -d '[:space:]')"
            max_rock_size=$((15 * 1024 * 1024 - 16 * 1024))
            if (( rock_size > max_rock_size )); then
              echo "$rock is too large for LuaRocks' 15 MiB upload limit ($rock_size bytes)" >&2
              exit 1
            fi
            ls -lh "$rock"
          done

      - name: Upload binary rock artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-conceal-service-${{ needs.prepare-service-rockspec.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: math-conceal-service-${{ needs.prepare-service-rockspec.outputs.version }}-1.*.rock
          if-no-files-found: error

  publish-service-rocks:
    name: Publish service source and binary rocks
    needs:
      - prepare-service-rockspec
      - build-service-binary-rock
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}

    steps:
      - name: Install Lua 5.1
        if: env.LUAROCKS_API_KEY != ''
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        if: env.LUAROCKS_API_KEY != ''
        uses: leafo/gh-actions-luarocks@v5

      - name: Download release rocks
        if: env.LUAROCKS_API_KEY != ''
        uses: actions/download-artifact@v4
        with:
          pattern: math-conceal-service-${{ needs.prepare-service-rockspec.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Publish source and binary rocks to LuaRocks
        if: env.LUAROCKS_API_KEY != ''
        shell: bash
        env:
          SERVICE_ROCKSPEC: ${{ needs.prepare-service-rockspec.outputs.path }}
          SERVICE_VERSION: ${{ needs.prepare-service-rockspec.outputs.version }}-1
        run: |
          set -euo pipefail

          rockspec="dist/$SERVICE_ROCKSPEC"
          test -f "$rockspec"

          # `luarocks upload` accepts a rockspec and an optional source rock only.
          # Publish those once here, after every platform binary has built.
          luarocks upload --force --api-key="$LUAROCKS_API_KEY" "$rockspec"

          version_response="$({
            curl --fail-with-body --silent --show-error --get \
              --header "Authorization: Bearer $LUAROCKS_API_KEY" \
              --data-urlencode "package=math-conceal-service" \
              --data-urlencode "version=$SERVICE_VERSION" \
              "https://luarocks.org/api/1/bearer/check_rockspec"
          })"
          version_id="$(python3 -c '
          import json
          import sys

          response = json.load(sys.stdin)
          version = response.get("version")
          if not version or not version.get("id"):
              raise SystemExit(f"LuaRocks did not return a version id: {response}")
          print(version["id"])
          ' <<< "$version_response")"

          mapfile -t binary_rocks < <(
            find dist -maxdepth 1 -type f \
              -name "math-conceal-service-${SERVICE_VERSION}.*.rock" \
              ! -name '*.src.rock' \
              -print | sort
          )
          if [ "${#binary_rocks[@]}" -eq 0 ]; then
            echo "No binary rocks found in dist" >&2
            exit 1
          fi

          for rock in "${binary_rocks[@]}"; do
            upload_response="$({
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $LUAROCKS_API_KEY" \
                --form "rock_file=@$rock" \
                "https://luarocks.org/api/1/bearer/upload_rock/$version_id"
            })"
            UPLOAD_RESPONSE="$upload_response" python3 - "$rock" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          response = json.loads(os.environ["UPLOAD_RESPONSE"])
          rock = response.get("rock")
          if not rock or not rock.get("arch"):
              raise SystemExit(f"LuaRocks did not confirm the binary upload: {response}")
          print(f"Uploaded {Path(sys.argv[1]).name} as {rock['arch']} (revision {rock['revision']})")
          PY
          done
