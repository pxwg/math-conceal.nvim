[package]
name = "typst-concealer-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
bytemuck = "1"
comemo = "0.5"
ecow = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset"] }
tiny-skia = "0.12"
typst = "0.15.1"
typst-eval = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader"] }
typst-render = "0.15.1"
